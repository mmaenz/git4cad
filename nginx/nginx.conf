worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Large enough for big CAD file pushes.
    client_max_body_size 500m;

    # Do not buffer git pack data — must stream through immediately.
    proxy_request_buffering off;
    proxy_buffering         off;

    upstream server_backend {
        server server:3000;
    }

    upstream frontend_app {
        server frontend:3001;
    }

    upstream seaweedfs_filer {
        server seaweedfs:8888;
    }

    server {
        listen 80;
        server_name _;

        # ── SeaweedFS GLB blob serving ─────────────────────────────────────
        # C++ server issues 302 Location: /seaweed/glb/...
        # Browser follows redirect here; nginx proxies directly to SeaweedFS.
        # The C++ server is never involved in blob download.
        location /seaweed/ {
            rewrite ^/seaweed/(.*)$ /$1 break;
            proxy_pass         http://seaweedfs_filer;
            proxy_set_header   Host $host;
            proxy_http_version 1.1;

            # GLBs are immutable (keyed by commit SHA) — cache aggressively.
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # ── Git smart HTTP ─────────────────────────────────────────────────
        # Must be before /api to avoid ambiguity.
        location ~ ^/[^/]+/[^/]+\.git(/.*)?$ {
            proxy_pass         http://server_backend;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   Authorization   $http_authorization;
            proxy_http_version 1.1;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ── REST API ───────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://server_backend;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   Authorization   $http_authorization;
            proxy_http_version 1.1;
        }

        # ── SvelteKit frontend ─────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend_app;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade         $http_upgrade;
            proxy_set_header   Connection      "upgrade";
        }
    }
}

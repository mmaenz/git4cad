services:

  # ── SeaweedFS ─────────────────────────────────────────────────────────────
  # Single-node: master + volume + filer all in one process.
  # GLB artifacts are stored here (write-once, read-many blobs).
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -filer -ip=seaweedfs -master.volumeSizeLimitMB=1024
    volumes:
      - ./data/seaweedfs:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://seaweedfs:8888/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── C++ git + CAD server ──────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      # Bind-mount the entire data directory so repos and users.json both survive restarts.
      - ./data:/data
    environment:
      G4C_DATA_DIR: /data
      G4C_HOST: 0.0.0.0
      G4C_PORT: "3000"
      G4C_CAD_WORKERS: "4"
      G4C_DEBUG: "false"
      G4C_SEAWEEDFS_FILER_URL: "http://seaweedfs:8888"
      G4C_SEAWEEDFS_PUBLIC_PREFIX: "/seaweed"
      G4C_PUBLIC_URL: "http://localhost"
    networks:
      - internal
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/repos"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── CLion dev container ───────────────────────────────────────────────────
  # Full C++ toolchain (cmake/ninja/gdb) + every dependency pre-built from the
  # same `builder` stage the production server image uses — no separate
  # Dockerfile to keep in sync. Source is bind-mounted live; nothing is baked
  # in or auto-run. Point CLion's Docker Compose toolchain at this service
  # (Settings → Build, Execution, Deployment → Toolchains → + → Docker
  # Compose → this file → service "clion-dev"). Open frontend/server as the
  # CLion project root so its CMakeLists.txt lines up with /src below.
  # Gated behind the "dev" profile so `docker compose up` never starts it by
  # accident; CLion starts/stops it itself when you build/run/debug.
  clion-dev:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: builder
    volumes:
      - ./server:/src
      - ./data:/data
    ports:
      - "3001:3000" # manual testing of a locally-run binary, bypassing nginx
    environment:
      G4C_DATA_DIR: /data
      G4C_HOST: 0.0.0.0
      G4C_PORT: "3000"
      G4C_CAD_WORKERS: "4"
      G4C_DEBUG: "true"
      G4C_SEAWEEDFS_FILER_URL: "http://seaweedfs:8888"
      G4C_SEAWEEDFS_PUBLIC_PREFIX: "/seaweed"
    networks:
      - internal
    depends_on:
      seaweedfs:
        condition: service_healthy
    command: ["sleep", "infinity"]
    profiles:
      - dev

  # ── SvelteKit frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    networks:
      - internal
    depends_on:
      - server
    restart: unless-stopped

  # ── nginx reverse proxy ───────────────────────────────────────────────────
  # Single public entrypoint on port 80.
  #   /seaweed/*  → SeaweedFS filer (GLB blob serving, bypasses C++ server)
  #   /api/*      → C++ server
  #   /*.git/*    → C++ server (git smart HTTP)
  #   /*          → SvelteKit frontend
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    depends_on:
      - server
      - frontend
    restart: unless-stopped

networks:
  internal:
    driver: bridge
